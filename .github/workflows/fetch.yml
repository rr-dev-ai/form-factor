name: Fetch sources

on:
  schedule:
    # UTC 16:20 = 北京时间次日 00:20
    - cron: '20 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 只跑 rss 源：39 个 scrape 源的 selector 均未调通（实测 0/39 能取到条目），
      # 全量跑只会固定产生 39 条失败，覆盖不了任何区域。调通后再放开。
      - name: Fetch enabled sources
        run: node scripts/fetch-sources.mjs --rss-only

      - name: Commit raw output
        run: |
          git config user.name "form-factor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/_raw
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: fetch sources $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: Upload artifact for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: content/_raw
          retention-days: 3
