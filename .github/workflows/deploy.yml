name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/news/**'
      - 'content/_meta/**'
      - 'src/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  # 不挂 schedule：05:20 的发布本身就会推送并触发构建，凌晨再定时重建一份同样的
  # 内容只是重复部署。部署失败时从 Actions 里重跑，或用 workflow_dispatch 手动触发。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
